<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Franko-Grace Contractor Acquisition System</title>
<link rel="stylesheet" href="style.css">
</head>
    
<body>

<div class="terminal">

    <div class="header">

        <div>FRANKO-GRACE CONTRACTOR ACQUISITION SYSTEM v1.1 Alpha</div>
        <div>NODE: EM-MAR-045</div>

        <div>
            DATABASE STATUS: ONLINE
            <span id="spinner1" class="spinner">|</span>
        </div>

        <div>
            CORPORATE LINK: STABLE
            <span id="spinner2" class="spinner">|</span>
        </div>

    </div>

    <div class="divider"></div>
    <div> Welcome to the Franco-Grace corporate network </div>
    <div class="divider"></div>

    <div id="output"></div>

    <div class="input-line">

        <span class="prompt">FG://</span>

        <div class="input-wrapper">

            <input
                id="command"
                autocomplete="off"
                spellcheck="false"
                autofocus
            >

            <span class="block-cursor"></span>

        </div>

    </div>

</div>

<script type="module" src="./js/app.js"></script>
    
</body>
</html>
